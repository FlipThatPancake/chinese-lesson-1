.cm-toggle{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;border:0!important;background:transparent!important;border-radius:11px;padding:0 5px;box-shadow:none;font-size:19px}
.cm-card-number{display:grid;place-items:center;width:35px;height:35px;border-radius:50%;background:#e9eddb;color:var(--accent);font-size:19px;font-weight:650;flex:none}
.cm-reveal-label{color:#63745a;font-size:16px;line-height:1.25}
.cm-card.cm-open{background:#fffef8;border-color:#b4c6a7}
.cm-open .cm-toggle{grid-column:auto;width:44px;min-width:44px;min-height:48px;padding:0;opacity:1!important}
.cm-open .cm-card-number{background:transparent;font-size:26px}
.cm-face{min-width:0;font-size:clamp(17px,1.7vw,23px);line-height:1.45;overflow-wrap:anywhere;text-align:left}
.cm-face-zh{font-size:clamp(21px,2vw,28px);font-weight:550}
.cm-face .word{font:inherit;line-height:1.35;min-width:44px;min-height:44px;padding:3px 1px;vertical-align:middle}
.cm-card.cm-matched{background:#edf5e7;border-color:#b9cba9}
.cm-matched .cm-card-number{color:#5b7d43;font-size:23px}
.cm-card.cm-peeking{background:#fff8e6;border-style:dashed;border-color:#c9b783}
.cm-status{margin:0;font-size:15px;line-height:1.45;color:#68795f;min-height:22px}
.cm-continue{align-self:flex-start;min-height:46px;margin:0;font-size:16px}
@media(max-width:950px){.cm-card{min-height:78px;padding:7px 9px;gap:5px}.cm-face{font-size:17px}.cm-face-zh{font-size:23px}.cm-grid{gap:9px}.cm-activity{gap:10px}}
@media(max-height:700px){.cm-card{min-height:70px;padding:5px 9px}.cm-toggle{min-height:58px}.cm-activity{gap:8px}.cm-grid{gap:7px}.cm-status{font-size:14px;line-height:1.35}.cm-continue{min-height:44px;font-size:15px}}

/* Deposit and rent stay visually distinct; controls remain large on iPad. */
.case-pay{display:flex;flex-direction:column;gap:16px;min-width:0;width:100%;max-width:840px}
.case-pay-prompt{font-size:clamp(25px,2.6vw,34px);font-weight:650;line-height:1.5}
.case-pay-instruction{font-size:17px;color:var(--muted,#63736b);line-height:1.5}
.case-pay-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.case-pay-card{position:relative;min-width:0;min-height:145px;padding:27px 8px 17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;border:2px solid transparent;border-radius:18px;touch-action:manipulation;box-shadow:none}
.case-pay-card.case-pay-deposit{background:#f7ead4;color:#79582b;border-color:#e5cc9f}
.case-pay-card.case-pay-rent{background:#edf3e6;color:#416846;border-color:#cfdfc3}
.case-pay-card.case-pay-deposit:hover{background:#f4e1c3;border-color:#b78c4e}
.case-pay-card.case-pay-rent:hover{background:#e3eed8;border-color:#7b9f68}
.case-pay-card.case-pay-deposit.is-included{background:#efd19f;border-color:#98703b}
.case-pay-card.case-pay-rent.is-included{background:#cce0b9;border-color:#537c42}
.case-pay-label{font-size:clamp(16px,1.7vw,21px);line-height:1.4;white-space:nowrap}
.case-pay-value{font-size:clamp(21px,2.2vw,29px);font-weight:720;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.6px;white-space:nowrap}
.case-pay-mark{position:absolute;top:7px;right:9px;display:grid;place-items:center;width:24px;height:24px;font-size:22px;font-weight:500;line-height:1;color:currentColor}
.case-pay-summary{display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:17px;row-gap:4px;padding-top:1px}
.case-pay-total-label{font-size:21px;color:var(--muted,#63736b)}
.case-pay-total{font-size:clamp(35px,4vw,48px);font-weight:720;line-height:1.25;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.case-pay-breakdown{grid-column:1/-1;font-size:17px;line-height:1.55;color:var(--muted,#63736b);font-variant-numeric:tabular-nums}
.case-pay-breakdown>span{margin:0 5px}
.case-pay-hint-row{display:flex;align-items:center;gap:12px;min-height:48px}
.case-pay-hint-button{flex:none;min-height:48px;font-size:16px}
.case-pay-hint{font-size:17px;line-height:1.6;color:var(--muted,#63736b)}
.case-pay-hint[hidden]{display:none}
@media(max-width:1050px){.case-pay-cards{gap:8px}.case-pay-card{min-height:130px;padding:25px 5px 15px}.case-pay-value{font-size:24px}.case-pay-label{font-size:17px}}

/* Teacher-controlled word/meaning memory pairs. No timers or automatic hiding. */
function renderCaseMemory(f, st) {
  const pairs = Array.isArray(f.pairs) ? f.pairs : [];
  const signature = JSON.stringify(pairs);
  const makeDeck = () => {
    const deck = pairs.flatMap((pair, pairIndex) => [
      { pair: pairIndex, side: 0 },
      { pair: pairIndex, side: 1 }
    ]);
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    return deck;
  };
  const fresh = () => ({ signature, deck: makeDeck(), open: [], matched: [], peek: false, message: '' });
  if (!st.caseMemory || st.caseMemory.signature !== signature) st.caseMemory = fresh();
  const memory = st.caseMemory;
  const isMatched = card => memory.matched.includes(card.pair);
  const waiting = memory.open.length === 2;
  const complete = pairs.length > 0 && memory.matched.length === pairs.length;
  const status = memory.peek
    ? t('先看看词语，收起提示后继续配对。', 'Take a look; hide the hints when you are ready to keep pairing.')
    : waiting
      ? t('这两张还没配成一对。可以多看一会儿，再翻下一对。', 'These two belong to different pairs. Keep looking, then try another pair.')
      : complete
        ? t('四组词语都找到了。选一组，读给老师听吧。', 'The word pairs are together. Choose one Chinese word to read aloud.')
        : memory.message || t('翻开两张，找出词语和意思。', 'Reveal two cards and connect a word with its meaning.');

  const cards = memory.deck.map((card, position) => {
    const matched = isMatched(card);
    const opened = memory.open.includes(position);
    const visible = matched || opened || memory.peek;
    const disabled = matched || opened || waiting || memory.peek;
    const value = String(pairs[card.pair][card.side] ?? '');
    const face = visible
      ? `<div class="cm-face ${card.side === 0 ? 'cm-face-zh' : 'cm-face-en'}">${card.side === 0 ? lex(value) : E(value)}</div>`
      : '';
    const label = matched
      ? t('已配对的卡片', 'Matched card')
      : visible
        ? t('已翻开的卡片', 'Revealed card')
        : t('翻开卡片', 'Reveal card');
    return `<div class="cm-card${visible ? ' cm-open' : ''}${matched ? ' cm-matched' : ''}${memory.peek && !matched ? ' cm-peeking' : ''}">
      <button type="button" class="cm-toggle" data-case-memory-card="${position}" aria-label="${E(label)} ${position + 1}" aria-pressed="${visible ? 'true' : 'false'}" ${disabled ? 'disabled' : ''}>
        <span class="cm-card-number" aria-hidden="true">${matched ? '✓' : visible ? '·' : position + 1}</span>
        ${visible ? '' : `<span class="cm-reveal-label">${E(t('翻开', 'Reveal'))}</span>`}
      </button>${face}
    </div>`;
  }).join('');

  // Use the established illustrated two-column layout even when f.type is memory.
  setStage({ ...f, type: 'match' }, `${prompt(f)}
    <div class="cm-activity">
      <div class="cm-grid" role="group" aria-label="${E(t('词语与意思配对', 'Word and meaning pairs'))}">${cards}</div>
      <p class="cm-status" aria-live="polite">${E(status)}</p>
      ${waiting && !memory.peek ? `<button type="button" class="quiet cm-continue" id="case-memory-continue">${E(t('再翻一对', 'Try another pair'))}</button>` : ''}
    </div>`);

  $$('[data-case-memory-card]').forEach(button => {
    button.onclick = event => {
      event?.preventDefault();
      event?.stopPropagation();
      const position = Number(button.dataset.caseMemoryCard);
      const card = memory.deck[position];
      if (!card || memory.peek || memory.open.length >= 2 || memory.open.includes(position) || isMatched(card)) return;
      memory.open.push(position);
      memory.message = '';
      if (memory.open.length === 2) {
        const [first, second] = memory.open.map(i => memory.deck[i]);
        if (first.pair === second.pair && first.side !== second.side) {
          memory.matched.push(first.pair);
          memory.open = [];
          memory.message = t('找到一对了。可以点中文词语看看拼音。', 'A pair is together. Tap the Chinese word if you would like its pinyin.');
        }
      }
      render();
    };
  });
  const continueButton = $('#case-memory-continue');
  if (continueButton) continueButton.onclick = () => {
    memory.open = [];
    memory.message = '';
    render();
  };

  actions(`<button type="button" class="quiet" id="case-memory-peek" aria-pressed="${memory.peek ? 'true' : 'false'}">${E(memory.peek ? t('收起提示', 'Hide hints') : t('看看全部', 'Peek at all'))}</button>
    <button type="button" class="quiet" id="case-memory-reset" aria-label="${E(t('重新配对', 'Reset word pairs'))}">${E(t('重新开始', 'Reset'))}</button>`);
  $('#case-memory-peek').onclick = () => {
    memory.peek = !memory.peek;
    render();
  };
  $('#case-memory-reset').onclick = () => {
    st.caseMemory = fresh();
    render();
  };
  // Lexical popups remain separate from the card-reveal buttons.
  bindWords($('#stage'));
}

  if(node.nodeType===3){if(!/[\u3007\u3400-\u9fff]/.test(node.nodeValue||''))return;const run=document.createElement('span');run.className='word-run';run.innerHTML=allWordsLex(node.nodeValue);node.replaceWith(run);return}

function renderAnimation(f,st){st.step??=0;let playing=false,interval=null;setStage(f,`${prompt(f)}<div class="anim-stage">${animationScene(f.kind)}</div><div class="anim-caption" aria-live="polite"><div id="anim-label"></div><div class="anim-en" id="anim-en"></div></div><div class="controls"><button class="icon" id="anim-back" aria-label="上一步">‹</button><button class="primary" id="anim-play">▶</button><button class="icon" id="anim-replay" aria-label="重播">↺</button><button class="icon" id="anim-next" aria-label="下一步">›</button></div>`);
 function stop(){playing=false;if(interval!==null)clearInterval(interval);interval=null;$('#anim-play').textContent='▶'}cleanups.push(stop);
 function draw(){let s=f.steps[st.step];$('#anim-label').innerHTML=lex(s.label);$('#anim-en').textContent=bi?s.text||'':'';$('#anim-back').disabled=st.step===0;$('#anim-next').disabled=st.step===f.steps.length-1;$('#anim-play').disabled=motionReduced;
 if(f.kind==='wardrobe'||f.kind==='restraint'){let mode=f.kind==='wardrobe';$('[data-layer="vest"]').style.opacity=mode&&st.step>=1?'1':'0';$('[data-layer="scarf"]').style.opacity=mode&&st.step>=2?'1':'0';$('[data-layer="decor"]').style.opacity=!mode&&st.step===0?'1':'0';$('[data-layer="pin"]').style.opacity=!mode&&st.step>=1?'1':'0';$('[data-rest-space]').style.opacity=!mode&&st.step>=2?'1':'0'}
 if(f.kind==='deposit'){$$('[data-pay]').forEach(x=>x.classList.toggle('arrived',+x.dataset.pay<st.step));$('[data-pay-total]').textContent='¥'+(st.step*3600).toLocaleString('en-US')}
 if(f.kind==='collision'){$('[data-rear]').style.transform=`translateX(${st.step===0?0:st.step===1?90:185}px)`;$('[data-impact]').style.opacity=st.step>=2?'1':'0'}
 if(f.kind==='strokes')$$('[data-stroke]').forEach(x=>x.classList.toggle('drawn',+x.dataset.stroke<st.step));
 if(f.kind==='repair'){$('[data-air]').style.opacity=st.step===0?'1':'0';$('[data-nocold]').style.opacity=st.step>=1?'1':'0';$('[data-phone]').style.opacity=st.step>=2?'1':'0';$('[data-confirm]').style.opacity=st.step>=3?'1':'0'}bindWords($('#anim-label'))}
 function advance(n){stop();st.step=Math.max(0,Math.min(n,f.steps.length-1));draw()}
 function play(restart){if(motionReduced)return;if(playing){stop();return}if(restart||st.step===f.steps.length-1)st.step=0;playing=true;draw();$('#anim-play').textContent='Ⅱ';interval=setInterval(()=>{st.step++;draw();if(st.step>=f.steps.length-1)stop()},f.kind==='strokes'?1900:2300)}
 $('#anim-back').onclick=()=>advance(st.step-1);$('#anim-next').onclick=()=>advance(st.step+1);$('#anim-play').onclick=()=>play(false);$('#anim-replay').onclick=()=>{stop();motionReduced?advance(0):play(true)};draw()}
function renderWriting(f,st){setStage(f,`${prompt(f)}<canvas class="pad" id="pad" aria-label="手写练习画板"></canvas>`);actions(`<button class="quiet" id="model-char">${t('范字','Model')}</button><button class="quiet" id="clear-pad">${t('清空','Clear')}</button>`);$('#model-char').onclick=()=>plainHelp(t('范字','Model'),[f.char+' · '+f.pinyin]);let canvas=$('#pad'),ctx=canvas.getContext('2d'),drawing=false,current=null;st.strokes??=[];function redraw(){let r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.strokeStyle='#2d5940';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';st.strokes.forEach(line=>{ctx.beginPath();line.forEach((p,i)=>i?ctx.lineTo(p[0]*r.width,p[1]*r.height):ctx.moveTo(p[0]*r.width,p[1]*r.height));if(line.length===1)ctx.lineTo(line[0][0]*r.width+.1,line[0][1]*r.height+.1);ctx.stroke()})}function point(e){let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}canvas.onpointerdown=e=>{e.preventDefault();drawing=true;canvas.setPointerCapture(e.pointerId);current=[point(e)];st.strokes.push(current);redraw()};canvas.onpointermove=e=>{if(!drawing)return;e.preventDefault();current.push(point(e));redraw()};canvas.onpointerup=canvas.onpointercancel=()=>drawing=false;$('#clear-pad').onclick=()=>{st.strokes=[];redraw()};let ro=new ResizeObserver(redraw);ro.observe(canvas);cleanups.push(()=>ro.disconnect());requestAnimationFrame(redraw)}
function go(n){if(n<0||n>=flat.length)return;index=n;render()}
$('#prev').onclick=()=>go(index-1);$('#next').onclick=()=>go(index===flat.length-1?0:index+1);
function teacherPanel(){let html=`<p>${E(L.student)} · ${E(L.level)} · ${L.duration}分钟</p><p>点状下划线词语：点击可看拼音和英文词义。点击照片可放大。学生界面不显示时长或图片署名。</p><button class="quiet" id="motion-btn">${motionReduced?'恢复动态':'减少动态'}</button><h3>课堂安排</h3><table>${L.groups.map(g=>`<tr><td>${E(g.title)}</td><td>${g.minutes}分钟</td></tr>`).join('')}</table><h3>教学提醒</h3>${L.teacherNotes.map(s=>`<p>${txt(s)}</p>`).join('')}<h3>来源与图片署名</h3><p>${txt(L.sourceNote)}</p>${Object.values(L.assets).map(a=>`<details><summary>${E(a.author)} · ${E(a.license)}</summary><p>${E(a.title)}<br><a href="${E(a.source)}" target="_blank" rel="noopener noreferrer">原图说明页</a> · <a href="${E(a.licenseUrl)}" target="_blank" rel="noopener noreferrer">许可</a><br>仅缩小与压缩；照片沿用原许可。来源链接需要联网，课堂功能不需要联网。</p></details>`).join('')}`;$('#teacher-content').innerHTML=html;$('#motion-btn').onclick=()=>{motionReduced=!motionReduced;render();teacherPanel()}}
$('#teacher-btn').onclick=()=>{teacherPanel();$('#teacher-dialog').showModal()};$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());$$('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target!==d)return;let r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}));
document.body.classList.add(L.accent);if(bi){$('#menu-btn').textContent='Menu';$('#teacher-btn').setAttribute('aria-label','Teacher panel')}
document.addEventListener('keydown',e=>{if($('dialog[open]')||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|CANVAS/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});render();
</script></body></html>
